<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Nutricional — Efrain</title>
<style>
:root {
  --bg: #f7f7f8;
  --bg2: #ffffff;
  --bg3: #f0f0f2;
  --text: #1a1a2e;
  --text2: #555;
  --accent: #2d6a4f;
  --accent2: #40916c;
  --accent-light: #d8f3dc;
  --border: #e0e0e0;
  --danger: #e63946;
  --warning: #f4a261;
  --info: #457b9d;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 10px;
  --cat-cereal: #e8d5b7;
  --cat-lacteo: #d4e8f7;
  --cat-grasa: #f7e4d4;
  --cat-fruta: #f7d4e8;
  --cat-leguminosa: #d4f7e4;
  --cat-proteina: #f7d4d4;
  --cat-verdura: #d4f7d4;
}
[data-theme="dark"] {
  --bg: #0f0f1a;
  --bg2: #1a1a2e;
  --bg3: #252540;
  --text: #e8e8f0;
  --text2: #a0a0b8;
  --accent: #52b788;
  --accent2: #74c69d;
  --accent-light: #1b3a2a;
  --border: #333355;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --cat-cereal: #3d3225;
  --cat-lacteo: #25303d;
  --cat-grasa: #3d2d25;
  --cat-fruta: #3d2530;
  --cat-leguminosa: #253d30;
  --cat-proteina: #3d2525;
  --cat-verdura: #253d25;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 70px;
}
.header {
  background: var(--accent);
  color: white;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 16px; font-weight: 600; }
.header-right { display: flex; gap: 10px; align-items: center; }
.theme-toggle {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 34px; height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.tab-bar {
  display: flex;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 48px;
  z-index: 99;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.week-selector::-webkit-scrollbar { display: none; }
.day-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  padding: 10px 14px;
  border: none;
  background: none;
  color: var(--text2);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.tab-content { display: none; padding: 16px; max-width: 900px; margin: 0 auto; }
.tab-content.active { display: block; }

/* Cards */
.card {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
}
.card-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.time-badge {
  background: var(--accent-light);
  color: var(--accent);
}

/* Supplement tracker */
.supp-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  gap: 10px;
}
.supp-row:last-child { border-bottom: none; }
.supp-check {
  width: 22px; height: 22px;
  accent-color: var(--accent);
  cursor: pointer;
}
.supp-info { flex: 1; }
.supp-name { font-size: 14px; font-weight: 500; }
.supp-detail { font-size: 12px; color: var(--text2); }
.supp-time {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  min-width: 55px;
  text-align: right;
}
.supp-done { text-decoration: line-through; opacity: 0.5; }

/* Meal card */
.meal-card {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.meal-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  cursor: pointer;
}
.meal-img {
  width: 70px; height: 70px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--bg3);
  font-size: 30px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}
.meal-info { flex: 1; min-width: 0; }
.meal-time { font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; }
.meal-name { font-size: 14px; font-weight: 600; margin: 2px 0; }
.meal-desc { font-size: 12px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meal-toggle { font-size: 18px; color: var(--text2); transition: transform 0.2s; }
.meal-toggle.open { transform: rotate(180deg); }
.meal-detail { padding: 0 14px 14px; display: none; }
.meal-detail.open { display: block; }
.ingredient-list { list-style: none; }
.ingredient-list li {
  padding: 5px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ingredient-list li:last-child { border-bottom: none; }
.ing-clickable {
  cursor: pointer;
  color: var(--accent);
  text-decoration: underline;
  text-decoration-style: dotted;
}
.ing-free { color: var(--text2); font-style: italic; }
.recipe-steps { margin-top: 12px; }
.recipe-steps h4 { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.recipe-steps ol { padding-left: 20px; }
.recipe-steps li { font-size: 13px; margin-bottom: 6px; line-height: 1.4; }

/* Shopping */
.week-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.week-btn {
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg2);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.week-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.progress-bar {
  height: 6px;
  background: var(--bg3);
  border-radius: 3px;
  margin: 8px 0 14px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s;
}
.progress-text { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.shop-category {
  margin-bottom: 12px;
}
.shop-cat-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
}
.shop-cat-badge {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
}
.shop-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.shop-item:last-child { border-bottom: none; }
.shop-item input { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; }
.shop-item.checked label { text-decoration: line-through; opacity: 0.5; }
.shop-item label { cursor: pointer; flex: 1; }

/* Equivalents */
.search-box {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg2);
  color: var(--text);
  font-size: 14px;
  margin-bottom: 14px;
}
.eq-group {
  margin-bottom: 12px;
}
.eq-group-title {
  font-size: 14px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.eq-items { display: none; }
.eq-items.open { display: block; }
.eq-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 12px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2);
  border-radius: 16px 16px 0 0;
  max-height: 70vh;
  width: 100%;
  max-width: 500px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto;
  cursor: pointer;
  padding: 10px 50px;
  background-clip: content-box;
}
.modal-header {
  padding: 10px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 15px; font-weight: 600; }
.modal-header p { font-size: 12px; color: var(--text2); margin-top: 2px; }
.modal-search {
  margin: 10px 16px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  width: calc(100% - 32px);
  background: var(--bg3);
  color: var(--text);
  font-size: 13px;
}
.modal-list {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1;
  padding: 0 16px 16px;
}
.modal-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}
.modal-close {
  position: absolute;
  top: 10px;
  right: 14px;
  background: none;
  border: none;
  font-size: 22px;
  color: var(--text2);
  cursor: pointer;
}

/* Supplement Calendar */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 10px;
}
.cal-day-header {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  padding: 4px;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  background: var(--bg3);
  border: 1px solid var(--border);
  position: relative;
}
.cal-day.empty { background: transparent; border: none; cursor: default; }
.cal-day.today { border-color: var(--accent); border-width: 2px; }
.cal-day .cal-dots {
  display: flex;
  gap: 2px;
  margin-top: 2px;
}
.cal-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--border);
}
.cal-dot.done { background: var(--accent); }
.cal-day.all-done { background: var(--accent-light); }

/* Plan semanal */
.day-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.day-tab {
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg2);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.day-tab.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* Reset btn */
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.btn-primary { background: var(--accent); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

.levo-banner {
  background: linear-gradient(135deg, var(--accent-light), var(--bg2));
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 14px;
  font-size: 12px;
  line-height: 1.5;
}
.levo-banner strong { color: var(--accent); }

/* ============ RESPONSIVE ============ */

/* iPhone safe areas (notch, home bar) */
@supports (padding: env(safe-area-inset-bottom)) {
  body { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  .header { padding-top: calc(14px + env(safe-area-inset-top)); }
}

/* Mobile-first: small screens (iPhone SE, regular iPhones) */
@media (max-width: 374px) {
  .header h1 { font-size: 14px; }
  .header-right span { display: none; }
  .tab-btn { padding: 8px 10px; font-size: 11px; }
  .meal-img { width: 56px; height: 56px; font-size: 24px; }
  .meal-name { font-size: 13px; }
  .cal-day { font-size: 10px; }
  .week-selector { gap: 4px; }
  .week-btn { font-size: 11px; padding: 6px 10px; }
}

/* Regular mobile (375px - 599px) */
@media (max-width: 599px) {
  .tab-content { padding: 12px; }
  .modal {
    max-height: 80vh;
    border-radius: 16px 16px 0 0;
  }
  .week-selector { flex-wrap: wrap; }
  .shop-item label { font-size: 13px; }
  .eq-item { padding: 8px 12px; }
}

/* Tablet + Desktop (600px+) */
@media (min-width: 600px) {
  .tab-btn { font-size: 13px; padding: 12px 20px; }
  .tab-content { padding: 20px; max-width: 960px; }
  .header { padding: 16px 24px; }
  .header h1 { font-size: 18px; }
  .card { padding: 20px; }
  .meal-header { padding: 16px; }
  .meal-img { width: 80px; height: 80px; font-size: 36px; }
  .meal-name { font-size: 16px; }
  .meal-desc { font-size: 13px; white-space: normal; }
  .meal-detail { padding: 0 20px 20px; }
  .ingredient-list li { padding: 7px 0; font-size: 14px; }
  .recipe-steps li { font-size: 14px; }
  .supp-name { font-size: 15px; }
  .supp-detail { font-size: 13px; }
  .levo-banner { font-size: 13px; padding: 16px; }
  .search-box { font-size: 15px; padding: 12px 16px; }
  .modal {
    max-height: 60vh;
    border-radius: 16px;
    margin-bottom: auto;
    margin-top: auto;
  }
  .modal-overlay { align-items: center; }
  .modal-item { font-size: 14px; padding: 10px 0; }
  .shop-item { font-size: 14px; padding: 10px 0; }
  .shop-item input { width: 20px; height: 20px; }
  .cal-day { font-size: 13px; }
  .progress-text { font-size: 13px; }
}

/* Large desktop (900px+) */
@media (min-width: 900px) {
  .tab-content { max-width: 1060px; }

  /* 2-column layout for meals in Plan Semanal and Recetas */
  #tab-plan .meal-card,
  #tab-recetas .meal-card {
    display: inline-block;
    width: calc(50% - 8px);
    vertical-align: top;
    margin-right: 14px;
  }
  #tab-plan .meal-card:nth-child(2n),
  #tab-recetas .meal-card:nth-child(2n) {
    margin-right: 0;
  }

  /* 2-column shopping list */
  .shop-category {
    display: inline-block;
    width: calc(50% - 8px);
    vertical-align: top;
    margin-right: 14px;
  }
  .shop-category:nth-child(2n) { margin-right: 0; }

  /* Wider modal */
  .modal { max-width: 560px; }

  .eq-group {
    display: inline-block;
    width: calc(50% - 8px);
    vertical-align: top;
    margin-right: 14px;
  }
  .eq-group:nth-child(2n) { margin-right: 0; }

  .header h1 { font-size: 20px; }
  .tab-btn { font-size: 14px; padding: 14px 24px; }
}

/* Touch targets: ensure minimum 44px hit area on mobile */
@media (pointer: coarse) {
  .tab-btn { min-height: 44px; }
  .supp-check { width: 24px; height: 24px; }
  .shop-item input { width: 22px; height: 22px; }
  .day-tab { min-height: 40px; }
  .week-btn { min-height: 40px; }
  .meal-header { min-height: 72px; }
  .ing-clickable { padding: 4px 0; display: inline-block; }
  .eq-group-title { min-height: 44px; display: flex; align-items: center; }
}

/* Smooth scrolling */
html { scroll-behavior: smooth; }

/* Prevent text overflow everywhere */
.meal-desc, .supp-name, .shop-item label {
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Water tracker */
.water-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
  padding: 8px 0;
}
.water-circle {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
  background: transparent;
}
.water-circle.filled {
  background: var(--accent);
}
.water-count {
  font-size: 13px;
  color: var(--text2);
  text-align: center;
  margin-top: 4px;
}

/* Levo timer */
.levo-timer {
  background: var(--accent-light);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px;
  margin-top: 8px;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
  color: var(--accent);
}
.levo-timer .timer-big {
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin: 4px 0;
}
.levo-timer.done {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* Shop slider */
.shop-slider-container {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
}
.shop-slider-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 600;
}
.shop-slider-value {
  background: var(--accent);
  color: white;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 13px;
}
.shop-slider {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--bg3);
  border-radius: 3px;
  outline: none;
}
.shop-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 3px solid var(--bg2);
  box-shadow: var(--shadow);
}
.shop-slider::-moz-range-thumb {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 3px solid var(--bg2);
}
.shop-slider-ticks {
  display: flex;
  justify-content: space-between;
  padding: 4px 2px 0;
  font-size: 11px;
  color: var(--text2);
}

/* Adherence bar (history) */
.adherence-card { margin-top: 14px; }
.adherence-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.adherence-label {
  font-size: 12px;
  min-width: 80px;
  color: var(--text2);
}
.adherence-bar {
  flex: 1;
  height: 16px;
  background: var(--bg3);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}
.adherence-fill {
  height: 100%;
  border-radius: 8px;
  transition: width 0.3s;
}
.adherence-pct {
  font-size: 12px;
  font-weight: 600;
  min-width: 36px;
  text-align: right;
}

/* Print-friendly (bonus) */
@media print {
  .header, .tab-bar, .theme-toggle, .btn, .supp-check, .shop-item input { display: none !important; }
  .tab-content { display: block !important; padding: 0; }
  .meal-detail { display: block !important; }
  body { padding: 0; background: white; color: black; }
}
</style>

<!-- iOS PWA meta tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan Nutricional">
<meta name="theme-color" content="#2d6a4f">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
</head>
<body>

<div class="header">

// ============ STATE ============
function getState(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; }
}
function setState(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

// ============ THEME ============
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
  setState('theme', isDark ? 'light' : 'dark');
}
(function initTheme() {
  const t = getState('theme', 'light');
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
})();

// ============ TABS ============
function switchTab(id) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  event.target.classList.add('active');
}

// ============ DATE HELPERS ============
const PLAN_START = new Date(2026, 7, 17); // Lunes 17 de agosto de 2026 (semana del plan asignado el 23/8/2026)
function getDayIndex() {
  const today = new Date();
  const diff = Math.floor((today - PLAN_START) / 86400000);
  if (diff < 0 || diff >= 28) return Math.max(0, diff % 7);
  return diff % 7;
}
function getWeekIndex() {
  const today = new Date();
  const diff = Math.floor((today - PLAN_START) / 86400000);
  return Math.min(3, Math.max(0, Math.floor(diff / 7)));
}
function getDateKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

// ============ RENDER: HOY ============
function renderHoy() {
  const dayIdx = getDayIndex();
  const dayName = DAYS[dayIdx];
  const dateKey = getDateKey();
  const suppState = getState('supps-' + dateKey, {});
  const waterState = getState('water-' + dateKey, 0);

  // Levo timer logic
  const levoTakenAt = getState('levo-time-' + dateKey, null);
  let timerHtml = '';
  if (suppState.levo && levoTakenAt) {
    const elapsed = Date.now() - levoTakenAt;
    const remaining = Math.max(0, 45 * 60 * 1000 - elapsed);
    if (remaining > 0) {
      const mins = Math.floor(remaining / 60000);
      const secs = Math.floor((remaining % 60000) / 1000);
      timerHtml = `<div class="levo-timer" id="levoTimer">
        ⏱ Puedes desayunar en
        <div class="timer-big" id="timerDisplay">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</div>
      </div>`;
    } else {
      timerHtml = `<div class="levo-timer done">✅ ¡Ya puedes desayunar!</div>`;
    }
  }

  let html = `
    <div class="levo-banner">
      <strong>💊 Levotiroxina — 7:00 AM</strong><br>
      En ayuno, solo con agua. Esperar 30-60 min antes de comer.
      ${timerHtml}
    </div>

    <div class="card">
      <div class="card-title">💧 Agua de hoy</div>
      <div class="water-row">
  `;
  for (let i = 0; i < 8; i++) {
    html += `<div class="water-circle ${i < waterState ? 'filled' : ''}" onclick="toggleWater(${i})">💧</div>`;
  }
  html += `</div>
      <div class="water-count">${waterState} / 8 vasos (${waterState * 250} ml)</div>
    </div>

    <div class="card">
      <div class="card-title">💊 Suplementos de hoy</div>
  `;
  SUPPLEMENTS.forEach(s => {
    const checked = suppState[s.id] || false;
    html += `
      <div class="supp-row ${checked ? 'supp-done' : ''}">
        <input type="checkbox" class="supp-check" ${checked ? 'checked' : ''} onchange="toggleSupp('${s.id}')">
        <div class="supp-info">
          <div class="supp-name">${s.emoji} ${s.name}</div>
          <div class="supp-detail">${s.detail}</div>
        </div>
        <div class="supp-time">${s.time}</div>
      </div>
    `;
  });
  html += '</div>';

  html += `<h3 style="margin:16px 0 10px;font-size:16px">${dayName} — ¿Qué cocino hoy?</h3>`;

  MEAL_TIMES.forEach(mt => {
    const meal = MEALS[mt.key][dayIdx];
    if (!meal) return;
    const mealId = `hoy-${mt.key}`;
    html += renderMealCard(meal, mt, mealId);
  });

  document.getElementById('tab-hoy').innerHTML = html;

  // Start timer interval if levo taken
  if (suppState.levo && levoTakenAt) {
    startLevoTimer(levoTakenAt);
  }
}

// ============ WATER TRACKER ============
function toggleWater(idx) {
  const dateKey = getDateKey();
  const current = getState('water-' + dateKey, 0);
  // If tapping the last filled circle, decrease; otherwise set to idx+1
  const newVal = (idx + 1 === current) ? idx : idx + 1;
  setState('water-' + dateKey, newVal);
  renderHoy();
}

// ============ LEVO TIMER ============
let levoInterval = null;

function startLevoTimer(takenAt) {
  if (levoInterval) clearInterval(levoInterval);
  levoInterval = setInterval(() => {
    const el = document.getElementById('timerDisplay');
    const timerContainer = document.getElementById('levoTimer');
    if (!el || !timerContainer) { clearInterval(levoInterval); return; }
    const remaining = Math.max(0, 45 * 60 * 1000 - (Date.now() - takenAt));
    if (remaining <= 0) {
      timerContainer.classList.add('done');
      timerContainer.innerHTML = '✅ ¡Ya puedes desayunar!';
      clearInterval(levoInterval);
      return;
    }
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    el.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }, 1000);
}

// ============ IMAGE LOOKUP ============
function getMealImg(mealKey, mealId) {
  // mealId formats: "hoy-desayuno", "plan-comida-3", "rec-colacion1-5"
  let dayIdx = -1;
  const parts = mealId.split('-');
  if (parts[0] === 'hoy') {
    dayIdx = getDayIndex();
  } else if (parts.length >= 3) {
    dayIdx = parseInt(parts[parts.length - 1]);
  }
  if (dayIdx < 0 || dayIdx > 6) return null;
  const key = `${mealKey}_${dayIdx}`;
  return MEAL_IMAGES[key] || null;
}

// ============ RENDER MEAL CARD ============
function renderMealCard(meal, mealTime, mealId) {
  const imgSrc = getMealImg(mealTime.key, mealId);
  const imgHtml = imgSrc
    ? `<img src="${imgSrc}" alt="${meal.name}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">`
    : meal.img;
  let html = `
    <div class="meal-card">
      <div class="meal-header" onclick="toggleMeal('${mealId}')">
        <div class="meal-img">${imgHtml}</div>
        <div class="meal-info">
          <div class="meal-time">${mealTime.emoji} ${mealTime.label} · ${mealTime.time}</div>
          <div class="meal-name">${meal.name}</div>
          <div class="meal-desc">${meal.ingredients.filter(i=>!i.free).map(i=>i.txt.split(' ').slice(-2).join(' ')).join(', ')}</div>
        </div>
        <div class="meal-toggle" id="toggle-${mealId}">▼</div>
      </div>
      <div class="meal-detail" id="detail-${mealId}">
        <h4 style="font-size:13px;font-weight:600;margin-bottom:8px">Ingredientes</h4>
        <ul class="ingredient-list">
  `;
  meal.ingredients.forEach(ing => {
    if (ing.free) {
      html += `<li><span class="ing-free">${ing.txt}</span></li>`;
    } else {
      html += `<li><span class="ing-clickable" onclick="showEquiv('${ing.group}', ${ing.qty}, '${ing.txt.replace(/'/g,"\\\'")}')">${ing.txt}</span><span class="badge time-badge">${ing.qty} porc.</span></li>`;
    }
  });
  html += '</ul>';
  if (meal.steps && meal.steps.length) {
    html += '<div class="recipe-steps"><h4>Preparación</h4><ol>';
    meal.steps.forEach(s => html += `<li>${s}</li>`);
    html += '</ol></div>';
  }
  html += '</div></div>';
  return html;
}

function toggleMeal(id) {
  const detail = document.getElementById('detail-' + id);
  const toggle = document.getElementById('toggle-' + id);
  detail.classList.toggle('open');
  toggle.classList.toggle('open');
}

// ============ SUPPLEMENTS ============
function toggleSupp(id) {
  const dateKey = getDateKey();
  const state = getState('supps-' + dateKey, {});
  state[id] = !state[id];
  setState('supps-' + dateKey, state);
  // Save timestamp when levo is checked for timer
  if (id === 'levo' && state[id]) {
    setState('levo-time-' + dateKey, Date.now());
  } else if (id === 'levo' && !state[id]) {
    setState('levo-time-' + dateKey, null);
    if (levoInterval) clearInterval(levoInterval);
  }
  renderHoy();
  renderSupps();
}

// ============ RENDER: PLAN SEMANAL ============
function renderPlan() {
  const selectedDay = getState('planDay', getDayIndex());
  let html = '<div class="day-tabs">';
  DAYS.forEach((d, i) => {
    html += `<button class="day-tab ${i === selectedDay ? 'active' : ''}" onclick="selectPlanDay(${i})">${d.substring(0,3)}</button>`;
  });
  html += '</div>';

  MEAL_TIMES.forEach(mt => {
    const meal = MEALS[mt.key][selectedDay];
    if (!meal) return;
    html += renderMealCard(meal, mt, `plan-${mt.key}-${selectedDay}`);
  });

  document.getElementById('tab-plan').innerHTML = html;
}

function selectPlanDay(idx) {
  setState('planDay', idx);
  renderPlan();
}

// Parse grams from amount string like "1/2 taza ~ 81 g" or "720 gramos"
function parseBaseGrams(amount) {
  const match = amount.match(/~\s*([\d.]+)\s*(g|kg)/i);
  if (match) {
    let val = parseFloat(match[1]);
    if (match[2].toLowerCase() === 'kg') val *= 1000;
    return val;
  }
  // Try "XXX gramos" format
  const match2 = amount.match(/([\d.]+)\s*gramos/i);
  if (match2) return parseFloat(match2[1]);
  return null;
}

// Parse descriptive qty like "3 y 3/4 lata", "18 pieza", "1/2 pieza"
function parseDescQty(amount) {
  const beforeTilde = amount.split('~')[0].trim();
  // Match patterns: "3 y 3/4 lata", "18 pieza", "1/2 pieza", "2 y 1/2 taza"
  const m = beforeTilde.match(/^([\d\s\/y.]+)\s+(.+)$/);
  if (!m) return null;
  const num = parseFraction(m[1]);
  return { qty: num, unit: m[2].trim() };
}

function formatShopAmount(item, weeks) {
  const desc = parseDescQty(item.amount);
  const grams = parseBaseGrams(item.amount);

  // If the descriptive unit is "gramos", just show weight
  if (desc && desc.unit.toLowerCase() === 'gramos') {
    const totalG = desc.qty * weeks;
    if (totalG >= 1000) return `${roundNice(totalG / 1000)} kg`;
    return `${roundNice(totalG)} g`;
  }

  let parts = [];

  // Descriptive part (piezas, latas, tazas, etc.)
  if (desc) {
    const scaled = roundNice(desc.qty * weeks);
    parts.push(`${scaled} ${desc.unit}`);
  }

  // Weight part
  if (grams) {
    const totalG = grams * weeks;
    if (totalG >= 1000) {
      parts.push(`${roundNice(totalG / 1000)} kg`);
    } else {
      parts.push(`${roundNice(totalG)} g`);
    }
  }

  return parts.join(' · ');
}

// ============ ADHERENCE HISTORY ============
function calcAdherence() {
  const today = new Date();
  let totalDays = 0;
  let suppDays = 0;
  let totalSupps = 0;
  let takenSupps = 0;
  let waterTotal = 0;
  let waterDays = 0;

  // Check from July 27 to today
  const start = new Date(2026, 6, 27);
  const end = new Date(Math.min(today.getTime(), new Date(2026, 7, 22).getTime()));

  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const dk = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    const ss = getState('supps-' + dk, {});
    const water = getState('water-' + dk, 0);
    totalDays++;
    const dayTaken = SUPPLEMENTS.filter(s => ss[s.id]).length;
    totalSupps += SUPPLEMENTS.length;
    takenSupps += dayTaken;
    if (dayTaken === SUPPLEMENTS.length) suppDays++;
    waterTotal += water;
    if (water >= 6) waterDays++; // 6+ vasos = good day
  }

  const shopState = getState('shop-checked', {});
  const shopChecked = SHOPPING.filter(s => shopState[s.name]).length;

  return {
    totalDays,
    suppPct: totalDays > 0 ? Math.round((takenSupps / totalSupps) * 100) : 0,
    suppPerfectDays: suppDays,
    waterAvg: totalDays > 0 ? roundNice(waterTotal / totalDays) : 0,
    waterGoodDays: waterDays,
    shopPct: Math.round((shopChecked / SHOPPING.length) * 100)
  };
}

function showEquiv(group, portions, originalTxt) {
  const data = EQUIVALENTS[group];
  if (!data) return;

  const p = Math.round(portions * 100) / 100;
  document.getElementById('modalTitle').textContent = `Sustitutos: ${originalTxt}`;
  document.getElementById('modalSubtitle').textContent = `= ${p} porción(es) de ${group}`;
  document.getElementById('modalSearch').value = '';

  currentModalItems = data.items.map(([name, basePortion]) => {
    let scaled = basePortion;
    if (portions !== 1) {
      const match = basePortion.match(/([\d\/\s.y]+)\s*(.*)/);
      if (match) {
        let num = parseFraction(match[1]);
        scaled = `${roundNice(num * portions)} ${match[2]}`;
      }
    }
    return [name, scaled];
  });

  renderModalList(currentModalItems);
  document.getElementById('modalOverlay').classList.add('open');
}

function parseFraction(str) {
  str = str.trim().replace('y ', '');
  if (str.includes('/')) {
    const parts = str.split('/');
    const whole = parts[0].includes(' ') ? parseFloat(parts[0].split(' ')[0]) : 0;
    const numStr = parts[0].includes(' ') ? parts[0].split(' ')[1] : parts[0];
    return whole + parseFloat(numStr) / parseFloat(parts[1]);
  }
  return parseFloat(str) || 1;
}

function roundNice(n) {
  if (Math.abs(n - Math.round(n)) < 0.05) return Math.round(n);
  return Math.round(n * 10) / 10;
}

// ============ SYNC: Share & Import ============

// Collect all localStorage data relevant to the plan
function getAllPlanData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('shop-') || key.startsWith('supps-') || key.startsWith('water-') || key.startsWith('levo-time-')) {
      data[key] = JSON.parse(localStorage.getItem(key));
    }
  }
  return data;
}

// Compress state to URL-safe string
function encodeState(data) {
  const json = JSON.stringify(data);
  // Use base64url encoding
  return btoa(unescape(encodeURIComponent(json)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeState(str) {
  try {
    const padded = str.replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(escape(atob(padded)));
    return JSON.parse(json);
  } catch (e) {
    console.error('Failed to decode state:', e);
    return null;
  }
}

// Share progress via URL
function shareProgress() {
  const data = getAllPlanData();
  if (Object.keys(data).length === 0) {
    alert('No hay datos para compartir aún.');
    return;
  }
  const encoded = encodeState(data);
  const url = window.location.origin + window.location.pathname + '?sync=' + encoded;

  // Try native share first (mobile), fallback to clipboard
  if (navigator.share) {
    navigator.share({
      title: 'Plan Nutricional — Progreso',
      text: 'Mi progreso de compras y suplementos',
      url: url
    }).catch(() => copyToClipboard(url));
  } else {
    copyToClipboard(url);
  }
}

function copyToClipboard(url) {
  navigator.clipboard.writeText(url).then(() => {
    alert('✅ Link copiado al portapapeles.\n\nÁbrelo en tu otro dispositivo para sincronizar.\n\n⚠️ El link contiene tu progreso actual. Cada vez que quieras sincronizar, genera uno nuevo.');
  }).catch(() => {
    // Fallback: show modal with URL
    prompt('Copia este link y ábrelo en tu otro dispositivo:', url);
  });
}

// Export all data as JSON file
function exportAllData() {
  const data = getAllPlanData();
  data._theme = getState('theme', 'light');
  data._shopView = getState('shopView', 'shop');
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `plan-nutricional-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// Import data from URL on page load
function loadFromURL() {
  const params = new URLSearchParams(window.location.search);
  const syncData = params.get('sync');
  if (!syncData) return;

  const data = decodeState(syncData);
  if (!data) {
    alert('❌ No se pudo leer los datos del link.');
    return;
  }

  const count = Object.keys(data).length;
  if (count === 0) return;

  const merge = confirm(
    `📲 Se encontraron datos de otro dispositivo:\n\n` +
    `• ${Object.keys(data).filter(k=>k.startsWith('shop-')).length} semanas de compras\n` +
    `• ${Object.keys(data).filter(k=>k.startsWith('supps-')).length} días de suplementos\n\n` +
    `¿Quieres importar estos datos?\n(Reemplazará tu progreso actual)`
  );

  if (merge) {
    for (const [key, val] of Object.entries(data)) {
      localStorage.setItem(key, JSON.stringify(val));
    }
    // Clean the URL
    window.history.replaceState({}, '', window.location.pathname);
    alert('✅ Datos importados correctamente.');
    location.reload();
  } else {
    window.history.replaceState({}, '', window.location.pathname);
  }
}

// Import from JSON file
function importFromFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        for (const [key, val] of Object.entries(data)) {
          if (key.startsWith('_')) continue; // skip meta
          localStorage.setItem(key, JSON.stringify(val));
        }
        alert('✅ Datos importados correctamente.');
        location.reload();
      } catch {
        alert('❌ Archivo inválido.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ============ INIT ============
loadFromURL(); // Check for sync data in URL first
renderHoy();
renderPlan();
renderCompras();
renderSupps();
renderEquiv();
renderRecetas();
</script>
